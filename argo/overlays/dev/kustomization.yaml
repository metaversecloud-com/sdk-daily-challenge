apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../services/dailych0
  - dailych0-config.yaml
  - dailych0-sealedsecret.yaml
  - dailych0-httpscaledobject.yaml
  - dailych0-interceptor-ingress.yaml
patches:
  # Drop the direct ALB Ingress: dev is fronted through the KEDA interceptor.
  - target:
      kind: Ingress
      name: dailych0
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: dailych0
images:
  - name: dailych0
    newName: 368076259134.dkr.ecr.us-east-1.amazonaws.com/sdk-example
    newTag: sdk-daily-challenge
